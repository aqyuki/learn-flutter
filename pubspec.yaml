name: flutter_training
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.13.5
  flutter: ^3.47.6

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  provider: ^6.1.5+1
  yumemi_weather:
